[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shekar"
version = "1.6.2"
description = "Simplifying Persian NLP for Modern Applications"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ahmad Amirivojdan", email = "amirivojdan@gmail.com" }]
requires-python = ">=3.11"

keywords = [
    "NLP",
    "Natural Language Processing",
    "Persian",
    "Shekar",
    "Text Processing",
    "Machine Learning",
    "Deep Learning",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: Linguistic",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Persian",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=2.0.0",
    "tqdm>=4.67.1",
    "onnxruntime>=1.28.0",
    "filelock>=3.20.0",
    "flashtext>=2.7",
    "sentencepiece>=0.2.2",
]

[project.optional-dependencies]
viz = [
    "wordcloud>=1.9.4",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.6.6",
    "pillow>=11.2.1",
]

all = [
  "shekar[viz]"
]

[dependency-groups]
dev = [
    "mkdocs-material>=9.7.7",
    "mkdocs>=1.6.1",
    "mkdocstrings[python]>=1.0.6",
    "pytest>=9.1.1",
    "ipykernel>=7.3.0",
    "coverage>=7.15.2",
    "termynal>=0.14.0",
    "ruff==0.16.1",
    "mkdocs-static-i18n>=1.3.1",
    "pre-commit>=4.6.1",
    "pytest-cov>=7.1.0",
    "onnx>=1.22.0",
]

[tool.ruff]
# Notebooks are authoring scratch space, not linted or formatted.
extend-exclude = ["*.ipynb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = ["shekar", ".venv", ".git", "examples", "lab"]

[project.scripts]
shekar = "shekar.__main__:main"

[project.urls]
Homepage = "https://github.com/amirivojdan/shekar"
Repository = "https://github.com/amirivojdan/shekar"
Documentation = "https://lib.shekar.io"
Issues = "https://github.com/amirivojdan/shekar/issues"
Changelog = "https://github.com/amirivojdan/shekar/releases"
