name: Test
on:
  push:
    # Commits that only touch docs, notebooks, or images cannot change test results.
    paths-ignore:
      - "docs/**"
      - "assets/**"
      - "examples/**"
      - "lab/**"
      - "*.md"
      - "header.png"
      - "mkdocs.yml"
      - "paper.bib"
      - "CITATION.cff"
      - "LICENSE"
      - ".github/workflows/publish.yml"

# A newer push to the same branch supersedes any run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.9.11"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project with all extras and dependency groups
        run: uv sync --all-extras --all-groups

      # Ruff and pytest come from the dev dependency group, matching local runs.
      - name: Run Ruff Format Check
        run: uv run ruff format shekar tests --check --diff

      - name: Run Ruff Lint
        run: uv run ruff check shekar tests

      - name: Run Tests
        env:
          # Real-model CPU/CUDA integration tests are opt-in for local runs.
          SHEKAR_BATCH_INTEGRATION: "off"
        run: uv run pytest --cov --cov-branch --cov-report=xml

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
